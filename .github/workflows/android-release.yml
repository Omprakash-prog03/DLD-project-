name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. apk-latest or v1.0.0)'
        required: true
        default: 'apk-latest'
      release_title:
        description: 'Release Title'
        required: true
        default: 'Smart Digital Clock – Latest Android Build'
  push:
    tags:
      - 'apk-*'
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          pip install cryptography

      - name: Execute Automated Test Suite
        run: |
          npx tsx test/run_all_tests.ts

      - name: Build Android Packages (Release APK, Debug APK & App Bundle)
        run: |
          python3 scripts/build_apk.py

      - name: Prepare Release Asset Filenames
        run: |
          mkdir -p release-assets
          cp public/downloads/smart-clock-release.apk release-assets/SmartClock-release.apk
          cp public/downloads/smart-clock-debug.apk release-assets/SmartClock-debug.apk
          cp public/downloads/SmartClock.apk release-assets/SmartClock.apk
          cp public/downloads/smart-clock.aab release-assets/SmartClock.aab

      - name: Determine Release Tag & Title
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
            echo "TITLE=${{ github.event.inputs.release_title }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "TAG=${TAG}" >> $GITHUB_OUTPUT
            echo "TITLE=Smart Digital Clock – Release ${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release with APK Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.TAG }}
          name: ${{ steps.release_info.outputs.TITLE }}
          body: |
            ## Smart Digital Clock Companion App — Android Release

            ### 📱 Download Installable APK
            - **[SmartClock-release.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.TAG }}/SmartClock-release.apk)** (Standalone signed release installer)
            - **[SmartClock.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.TAG }}/SmartClock.apk)** (Release mirror)
            - **[SmartClock-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.TAG }}/SmartClock-debug.apk)** (Diagnostic build with logs)
            - **[SmartClock.aab](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.TAG }}/SmartClock.aab)** (Google Play Store bundle)

            ### Package Specifications
            - **Package ID**: `com.smartclock.mobile`
            - **App Name**: Smart Clock
            - **Version**: `1.0.0` (Build 1)
            - **Min SDK**: Android 5.0 (API 21)
            - **Target SDK**: Android 14 (API 34)
            - **Hardware Subsystems**: ESP32-WROOM-32, DS3231 RTC, CD4518/74HCT245 BCD, Piezo Buzzer (GPIO 25 PWM)
          files: |
            release-assets/SmartClock-release.apk
            release-assets/SmartClock-debug.apk
            release-assets/SmartClock.apk
            release-assets/SmartClock.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display Public Download URLs
        run: |
          TAG="${{ steps.release_info.outputs.TAG }}"
          REPO="${{ github.repository }}"
          echo "=================================================================="
          echo "  PUBLIC GITHUB RELEASE DIRECT DOWNLOAD URLS:"
          echo "=================================================================="
          echo "Release APK: https://github.com/${REPO}/releases/download/${TAG}/SmartClock-release.apk"
          echo "Debug APK:   https://github.com/${REPO}/releases/download/${TAG}/SmartClock-debug.apk"
          echo "Mirror APK:  https://github.com/${REPO}/releases/download/${TAG}/SmartClock.apk"
          echo "Bundle AAB:  https://github.com/${REPO}/releases/download/${TAG}/SmartClock.aab"
          echo "Release Page: https://github.com/${REPO}/releases/tag/${TAG}"
          echo "=================================================================="
